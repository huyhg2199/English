- id: "28"
  title: "Chia bài T1 theo ngày và gợi ý ôn khi sai lặp lại"
  description: |-
    - LessonContent có thêm `parts`: s1-t1-w1 chia 12 nguyên âm thành 3 ngày, mỗi ngày 4 âm (gần tiếng Việt trước, /ɝː ɚ/ cuối); W2 chia nguyên âm đôi thành 2 phần; W3 chia phụ âm thành 4 nhóm 6 âm. Mỗi phần có câu luyện nói chỉ dùng kiến thức đã học.
