# Đợt 1c — Nắm chắc nền & các thì (kiểm tra 2026-11-11; Huy: "hoàn thiện giúp tôi đi"). Thứ tự chạy: 32, 33, 34, 35, 36, 38, 39, 37, 40, 41, 43, 44, 45, 46, 42, 47.
