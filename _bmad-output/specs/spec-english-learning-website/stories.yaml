- id: "31"
  title: "Máy tính D3: phím tắt và lưới cho Hôm nay, Lộ trình"
  description: |-
    - Tạo use-hotkeys và shouldHandleKey có unit test: bỏ qua khi đang gõ IME (isComposing, keyCode 229), ở ô nhập liệu, mở dialog, đang chọn chữ, giữ phím bổ trợ, phím giữ lặp (e.repeat); Space/Enter khi đang focus nút, link hay contenteditable thì để trình duyệt xử lý.
    - FlashcardSession: Space lật thẻ, 1–4 chấm (chỉ khi thẻ đã lật và không phải thẻ 'Làm quen'), K đã biết, L nghe.
    - QuestionCard và BrickPlayer: 1–4 chọn, Enter sang câu tiếp.
    - Session: → và ←.
    - Gợi ý <kbd> chỉ hiện với pointer-fine.
    - Hôm nay lưới 2 cột; Lộ trình xếp tháng thành 2 cột.
    - Script kiểm tra có thêm bước gõ 'chào' vào ô tìm kiếm của Sổ tay để chắc không phím tắt nào chạy.
