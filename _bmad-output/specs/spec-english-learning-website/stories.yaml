    - Hôm nay mời 'Ôn viên gạch X n'?' theo learning-rules mục Sổ lỗi (2 câu sai trong 14 ngày cùng khái niệm viên X dạy, n = số phút của viên, ẩn khi ôn xong hoặc 'Để sau'). Chỉ là lời mời, không chặn gì.
