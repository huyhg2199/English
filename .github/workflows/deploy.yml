name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check words.json khớp với scripts/vocab (không sửa tay, không quên build lại)
        run: npm run vocab:build && git diff --exit-code src/data/vocab/words.json
      - run: npm test
      # Vite ưu tiên biến môi trường có sẵn hơn file .env.*, kể cả biến rỗng, nên KHÔNG đặt env cho bước build
      # (biến rỗng sẽ đè mất giá trị trong .env.production). Cấu hình mặc định nằm ở .env.production (đã commit);
      # nếu có Actions Variables/Secrets thì ghi vào .env.production.local (ưu tiên hơn), chỉ khi khác rỗng.
      - name: Cấu hình Supabase từ Variables/Secrets (nếu có)
        env:
          SB_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          : > .env.production.local
          if [ -n "$SB_URL" ]; then echo "VITE_SUPABASE_URL=$SB_URL" >> .env.production.local; fi
          if [ -n "$SB_KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$SB_KEY" >> .env.production.local; fi
      - run: npm run build
      - name: Báo nếu build không có cấu hình Supabase
        run: |
          if ! cat .env.production .env.production.local 2>/dev/null | grep -q '^VITE_SUPABASE_URL=..*' \
            || ! cat .env.production .env.production.local 2>/dev/null | grep -q '^VITE_SUPABASE_ANON_KEY=..*'; then
            echo "::warning::Thiếu VITE_SUPABASE_URL hoặc VITE_SUPABASE_ANON_KEY nên app build ra sẽ bỏ qua đăng nhập."
          fi
      - name: Check PWA files
        run: test -f dist/manifest.webmanifest && test -f dist/sw.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Chỉ deploy khi push (hoặc chạy tay) trên main. develop chỉ build + test.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
